quarkus.devservices.datasource.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.enabled=false
quarkus.datasource.devservices.init-script-path=test-sql-script.sql
quarkus.datasource.db-kind=postgresql
registry.autocompletion-enabled-for=commodityCode,dataCarrierTypes
registry.default-template-name=rest-default-schema.json
quarkus.log.category."it.extrared.registry.api.rest".level=DEBUG
jwks.server.base-url=http://localhost:${quarkus.wiremock.devservices.port}
jws.header-name=x-jws-signature
%test.smallrye.jwt.sign.key.location=test-private.pem
%test.smallrye.jwt.encrypt.key.location=test-public.pem